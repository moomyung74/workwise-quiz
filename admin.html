<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>WorkWise Quiz — Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap">
  <div class="brand">WorkWise <span>Quiz</span></div>
  <div class="tag">Developer dashboard</div>
</div></header>
<main>
  <section id="login" class="card" hidden>
    <h2>Developer login</h2>
    <p class="sub">Only the developer account can see statistics.</p>
    <input class="search field" id="email" type="email" placeholder="Email" autocomplete="username">
    <input class="search field" id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="go">Log in</button>
    <div class="msg" id="msg"></div>
  </section>
  <section id="dash" hidden></section>
</main>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="admin.js"></script>
</body>
</html>
